<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월별 저축액</title>
    <style>
        table{
            border: 1px solid #aaa;
            text-align: center;
        }
        th, td{
            border: 1px solid #aaa;
            padding: 30px;
        }
        thead{
            background-color: aliceblue;
        }
        tfoot{
            background-color: #eee;
        }
    </style>
</head>
<body>
    <h2>월별 저축액</h2>
    <!-- thead, tbody, tfoot 구조 구성됨 -->
    <table>
        <thead>
            <tr>
                <!-- 제목행 <th> -->
                <th>월별</th>
                <th>저축액</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>8월</td>
                <td>300000</td>
            </tr>
            <tr>
                <td>9월</td>
                <td>400000</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>합계</td>
                <td>700000</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
