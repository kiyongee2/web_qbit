<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>도서 목록</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
	  <div class="container">
	    <a class="navbar-brand fw-bold" th:href="@{/home}">BookMarket</a>
	    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
	      aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
	      <span class="navbar-toggler-icon"></span>
	    </button>
	
	    <div class="collapse navbar-collapse justify-content-end" id="menu">
	      <ul class="navbar-nav">
	        <li class="nav-item"><a class="nav-link" th:href="@{/books/IT전문서}">IT전문서</a></li>
	        <li class="nav-item"><a class="nav-link" th:href="@{/books/IT교육교재} ">IT교육교재</a></li>
	      </ul>
	    </div>
	  </div>
	</nav>
	<section class="container bg-light py-4">
	  <div class="container">
	    <h1 class="display-5 fw-bold">도서 목록</h1>
	  </div>
	  <div class="row align-items-md-stretch text-center py-5">
		<div class="col-md-4" th:each="book:${bookList}">
		  <h3 th:text="${book.name}"></h3>
		  <p th:text="${book.author}">
		  <p th:text="${book.publisher} + ' | ' + ${book.releaseDate}">
		  <p align="left" th:text="${book.description}">
		  <p th:text="${book.unitPrice} + '원'">
		  <p><a th:href="'/BookMarket/books/book?id=' + ${book.bookId}"
		  		class="btn btn-secondary" role="button">상세정보 &raquo;</a>
	  	</div>
	  </div>
	</section>
	
	<footer class="pt-3 mt-4 text-body-secondary border-top">
		<div class="container pt-5">
			<p class="fs-5">&copy; BookMarket</p>
		</div>
	</footer>
</body>
</html>
