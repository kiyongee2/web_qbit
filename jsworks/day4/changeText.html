<!DOCTYPE html>
<html>
  <head>
    <title>DOM 예제</title>
  </head>
  <body>
    <h1 id="switch" onclick="changeText()">Click on this Text</h1>
    
    <script>
      function changeText(){
        let text = document.getElementById("switch");
        text.style.color = "blue";
         text.innerText = "Hello~ "

        document.querySelector("#switch").innerText = "Hello~ World"
      }
    </script>
  </body>
</html>
