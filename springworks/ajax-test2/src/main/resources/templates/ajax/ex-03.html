<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ex07</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
	<button onclick="ex03Fn()">ex03 함수 호출</button>
</body>

<script type="text/javascript">
	const ex03Fn = () => {
		const text = "Hello~";
		
		const params = {
			"param1": text,
			"param2": "안녕"
		}
		
		$.ajax({
			//요청 방식: get, 요청 주소: /ex03, 요청 데이터: data
			type: "post",
			url: "/ex03",
			data: JSON.stringify(params), //json 데이터로 변환
			contentType: "application/json", //컨텐트 타입 지정
			//요청이 성공했을 때 실행되는 부분
			success: function(res){
				console.log("성공", res);
				console.log("param1: ", res.param1);
				console.log("param2: ", res.param2);
			},
			//요청이 실패했을 때 실행되는 부분
			error: function(){
				console.log("실패");
			}
		})
	}
</script>
</html>
