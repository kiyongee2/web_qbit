<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Welcome~</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<section id="container">
		<h2>게시판(페이징)</h2>
		<table class="boardList">
			<thead>
				<tr>
					<th>번호</th><th>제목</th><th>글쓴이</th><th>조회수</th><th>작성일</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="b: ${boardList}">
					<td th:text="${b.id}"></td>
					<td>
						<a th:href="@{/boards/{id}(id=${b.id})}" th:text="${b.title}"></a>
					</td>
					<td th:text="${b.writer}"></td>
					<td th:text="${b.hits}"></td>
					<td th:text="${#dates.format(b.regDate, 'yyyy-MM-dd HH:mm')}"></td>
				</tr>
			</tbody>
		</table>
		
		<!-- 페이지 영역 -->
		<div class="pagination">
			<!-- 이전 페이지, 예) 2페이지 클릭, db는 1page임 -->
			<a th:href="${boardList.first} ? '#' : 
					@{/boards/pages(page=${boardList.number})}" th:text="Prev"></a>
			<!-- 페이지 번호 블럭 
			     처음: ${#numbers.sequence(1, 5) -->
			<span th:each="page : ${#numbers.sequence(startPage, endPage)}">
			     <!-- 번호를 누르면 페이지 바뀜 -->
				  <a th:href="@{/boards/pages(page=${page})}"
				     th:text="${page}"></a>
			</span>
			<!-- 다음 페이지 -->
			<a th:href="${boardList.last} ? '#' 
					: @{/boards/pages(page=${boardList.number + 2})}" th:text="Next"></a>
		</div>
		
		<!-- 글쓰기 버튼 -->
		<div class="btnWrite">
			<a th:href="@{/boards/write}"><button>글쓰기</button></a>
		</div>
	</section>
</body>
</html>
