<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Welcome~</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<section id="container">
		<h2>게시글 목록</h2>
		<!-- 검색 영역 -->
		<!-- 제목만 검색할 경우 
		<form th:action="@{/boards/pages}" method="get"
				class="searchForm">
			<input type="text" name="keyword" th:value="${kw}">
			<input type="submit" value="검색">
		</form>
		-->
		
		<!-- 제목과 내용을 검색할 경우 -->
		<form th:action="@{/boards/pages}" method="get"
				class="searchForm">
			<select name="type">
				<option th:value="title" th:text="제목" 
							th:selected="${type eq 'title'}"></option>
				<option th:value="content" th:text="내용" 
							th:selected="${type eq 'content'}"></option>
			</select>
			<input type="text" name="keyword" th:value="${kw}">
			<input type="submit" value="검색">
		</form>
		
		<!-- 글 목록 -->
		<table class="boardList">
			<thead>
				<tr>
					<th>번호</th><th>제목</th><th>글쓴이</th><th>조회수</th><th>작성일</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="b: ${boardList}">
					<td th:text="${b.id}"></td>
					<td>
						<a th:href="@{|/boards/${b.id}|(page=${boardList.number+1})}" 
								th:text="${b.title}"></a>
					</td>
					<td th:text="${b.writer}"></td>
					<td th:text="${b.hits}"></td>
					<td th:text="${#dates.format(b.regDate, 'yyyy-MM-dd HH:mm')}"></td>
				</tr>
			</tbody>
		</table>
		
		<!-- 페이지 영역 -->
		<div class="pagination">
			<!-- 이전 페이지, 예) 2페이지 클릭, db는 1page임 -->
			<a th:href="${boardList.first} ? '#' : 
					@{/boards/pages(page=${boardList.number})}" th:text="Prev"></a>
			<!-- 페이지 번호 블럭 
			     처음: ${#numbers.sequence(1, 5) -->
			<span th:each="page : ${#numbers.sequence(startPage, endPage)}">
			     <!-- 번호를 누르면 페이지 바뀜 -->
				  <a th:href="@{/boards/pages(page=${page})}"
				     th:text="${page}"></a>
			</span>
			<!-- 다음 페이지 -->
			<a th:href="${boardList.last} ? '#' 
					: @{/boards/pages(page=${boardList.number + 2})}" th:text="Next"></a>
		</div>
		
		<!-- 글쓰기 버튼 -->
		<div class="btnWrite">
			<a th:href="@{/boards/write}"><button>글쓰기</button></a>
		</div>
	</section>
</body>
</html>
