<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>text 스타일 예제</title>
        <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&display=swap" rel="stylesheet">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Nanum+Myeongjo&family=Nanum+Pen+Script&display=swap');
            #content {
                width: 700px;
                margin: 0 auto; /* 가로 가운데 정렬 */
                border: 2px solid #000000;
                padding: 20px;
            }
            h1{color: #058105;}
            h2{font-family: "Nanum Pen Script";}
            p{
                line-height: 2;
                font-size: 18px;
            }
            #p2 { font-family: 'Nanum Myeongjo', serif; }
            .redText {
                color: #ff0000;
                font-style: italic; /* 기울임 */
                font-weight: bold;  /* 굵게 */
            }
        </style>
    </head>
    <body>
        <div id="content">
            <h1>세계 10대 슈퍼푸드</h1>
            <h2>마늘(Garlic)</h2>
            <p id="p1">일해백리(一害百利)는 마늘의 별명이다. 한가지 해가 있고 백가지 이로움이
                있다는 뜻이다.<br> 그 한가지 해란 아린 맛으로 위에 부담을 준다는 것이다.
            </p>
            <p id="p2">마늘 특유의 아린 맛은 <span class="redText">알리신</span>이라는 성분  
            때문으로 <span class="redText">살균 및 항균작용</span>을 하며<br>
            마늘에 들어있는 아연이 피로 회복에 도움을 준다
        </p>
        </div>
    </body>
</html>
