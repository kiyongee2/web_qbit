<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<header th:fragment="header-fragment">
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container-fluid">
			<!-- 로고 -->
			<a class="navbar-brand fw-bold" th:href="@{/}">GoodRelation</a>

			<!-- 반응형 토글 버튼 -->
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
				aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>

			<!-- 메뉴 + 검색 -->
			<div class="collapse navbar-collapse justify-content-between" id="navbarNav">
				<!-- 왼쪽 메뉴 -->
				<ul class="navbar-nav">
					<th:block sec:authorize="isAnonymous()">
						<li class="nav-item ">
							<a class="nav-link" th:href="@{/members/login}">로그인</a>
						</li>
					</th:block>
					<th:block sec:authorize="isAuthenticated()">
						<li class="nav-item d-flex justify-content-between 
										align-items-center text-warning" >
							[<span th:text="${#authentication.principal.name}"></span>]님 
							<a class="nav-link" th:href="@{/logout}">로그아웃</a>
						</li>
					</th:block>
					<li class="nav-item"><a class="nav-link" th:href="@{/members/join}">회원가입</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/members}">회원목록</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/boards/pages}">게시판</a></li>
					<li class="nav-item"><a class="nav-link" th:href="@{/admin/dashboard}">관리자</a></li>
				</ul>

				<!-- 오른쪽 검색 폼 
				<form class="d-flex" role="search" th:action="@{/boards/search}" method="get">
					<input class="form-control me-2" type="search" name="keyword" placeholder="게시글 검색..." aria-label="Search">
					<button class="btn btn-outline-light" type="submit">검색</button>
				</form>
				-->
			</div>
		</div>
	</nav>
</header>
