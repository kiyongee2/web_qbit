<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
<meta charset="UTF-8">
	<title>글쓰기</title>
	<link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css}" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
	<div th:replace="~{/layout/header::header-fragment}"></div>
	<section class="container bg-light py-4">
	  <div class="container">
	    <h1 class="display-5 fw-bold">글쓰기</h1>
	  </div>
		<!-- validation -->
		<form th:action="@{/boards/write}" method="post" th:object="${boardDTO}"
				 enctype="multipart/form-data" class="py-4">
			<div th:if="${#fields.hasAnyErrors()}">
			    <div th:each="err : ${#fields.allErrors()}"
			         th:text="${err}" class="error"></div>
			</div>
			<div class="mb-3 row">
	  			<div class="col-sm-3">
	  				<input type="text" th:field="*{title}" 
	  					class="form-control" placeholder="제목">
	  			</div>
	  		</div>
			<div class="mb-3 row">
	  			<div class="col-sm-3">
	  				<textarea rows="8" cols="60" th:field="*{content}" 
							    placeholder="내용"></textarea>
	  			</div>
	  		</div>
			<div class="mb-3 row">
	  			<div class="col-sm-3">
	  				<input type="file" name="uploadFile" 
	  					class="form-control" placeholder="제목">
	  			</div>
	  		</div>
			<div class="mb-3 row">
				<div sec:authorize="isAuthenticated()">
					<div class="col-sm-3">
						<input type="text" name="writer" size=62
							th:value="${#authentication.principal.name}">
					</div>
				</div>
			</div>
			<div class="mt-4 row">
	  			<div class="col-sm-offset-2 col-sm-10">
	  				<input type="submit" class="btn btn-primary" value="등록">
	  				<input type="reset" class="btn btn-secondary" value="취소">
  				</div>
  			</div>
		</form>
	</section>
</body>
</html>
