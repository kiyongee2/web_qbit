<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>회원 가입...</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<section id="container">
		<h2>회원 가입</h2>
		<form th:action="@{/members/join}" method="post" 
				th:object="${memberDTO}" class="joinForm">
			<div th:if="${#fields.hasAnyErrors()}" class="error">
			    <div th:each="err : ${#fields.allErrors()}"
			    	 th:text="${err}"></div>
			</div>
			<fieldset>
				<ul>
					<li>
						<label for="email">이메일</label>
						<input type="text" name="email" th:value="${email}">
					</li>
					<li>
						<label for="passwd">비밀번호</label>
						<input type="password" name="passwd" th:value="${passwd}">
					</li>
					<li>
						<label for="name">이름</label>
						<input type="text" name="name" th:value="${name}">
					</li>
					<li>
						<label for="gender">성별</label>
						<input type="radio" name="gender" value="남자" checked>남
						<input type="radio" name="gender" value="여자">여
					</li>
					<li>
						<input type="submit" value="가입">
						<input type="reset" value="취소">
					</li>
				</ul>
			</fieldset>
		</form>
	</section>
</body>
</html>
