<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>게시글 목록</title>

  <!-- Bootstrap CSS -->
  <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css}"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
  
  <!-- Bootstrap Icons (검색, 글쓰기 아이콘용) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    body {
      background-color: #f8f9fa;
    }
    h1 {
      color: #212529;
    }
    table a {
      text-decoration: none;
      color: #0d6efd;
    }
    table a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <!-- 공통 헤더 -->
  <div th:replace="~{/layout/header::header-fragment}"></div>

  <section class="container bg-light py-4 mt-3 rounded shadow-sm">
    <div class="container pb-4">
      <h1 class="display-6 fw-bold">게시글 목록</h1>
    </div>

    <!-- 검색 & 글쓰기 영역 -->
    <form th:action="@{/boards/pages}" method="get" class="mb-4">
      <div class="row g-2 justify-content-end align-items-center">
        <!-- 검색 타입 -->
        <div class="col-md-2 col-sm-3">
          <select class="form-select" name="type">
            <option th:value="title" th:text="제목" th:selected="${type eq 'title'}"></option>
            <option th:value="content" th:text="내용" th:selected="${type eq 'content'}"></option>
          </select>
        </div>

        <!-- 검색어 입력 -->
        <div class="col-md-4 col-sm-5">
          <input type="text" name="keyword" th:value="${kw}" class="form-control" placeholder="검색어를 입력하세요">
        </div>

        <!-- 검색 버튼 -->
        <div class="col-auto">
          <button type="submit" class="btn btn-success">
            <i class="bi bi-search"></i> 검색
          </button>
        </div>

        <!-- 글쓰기 버튼 -->
        <div class="col-auto" sec:authorize="isAuthenticated()">
          <a th:href="@{/boards/write}" class="btn btn-primary">
            <i class="bi bi-pencil-square"></i> 글쓰기
          </a>
        </div>
      </div>
    </form>

    <!-- 글 목록 -->
    <table class="table table-hover table-striped table-bordered mt-4 align-middle">
      <thead class="table-secondary text-center">
        <tr>
          <th>번호</th>
          <th>제목</th>
          <th>글쓴이</th>
          <th>조회수</th>
          <th>작성일</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="b: ${boardList}">
          <td th:text="${b.id}" class="text-center"></td>
          <td>
            <a th:href="@{|/boards/${b.id}|(page=${boardList.number+1})}" th:text="${b.title}"></a>
          </td>
          <td th:text="${b.writer}" class="text-center"></td>
          <td th:text="${b.hits}" class="text-center"></td>
          <td th:text="${#dates.format(b.regDate, 'yyyy-MM-dd HH:mm')}" class="text-center"></td>
        </tr>
      </tbody>
    </table>

    <!-- 페이지네이션 -->
    <nav>
      <ul class="pagination justify-content-center">
        <li class="page-item" th:classappend="${boardList.first} ? 'disabled'">
          <a class="page-link" th:href="@{/boards/pages(page=${boardList.number})}">이전</a>
        </li>
        <li class="page-item"
            th:each="page : ${#numbers.sequence(startPage, endPage)}"
            th:classappend="${page == boardList.number + 1} ? 'active'">
          <a class="page-link" th:href="@{/boards/pages(page=${page})}" th:text="${page}"></a>
        </li>
        <li class="page-item" th:classappend="${boardList.last} ? 'disabled'">
          <a class="page-link" th:href="@{/boards/pages(page=${boardList.number + 2})}">다음</a>
        </li>
      </ul>
    </nav>
  </section>
</body>
</html>
