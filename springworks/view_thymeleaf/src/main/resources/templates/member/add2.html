<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 등록</title>
</head>
<body>
	<h1>회원 등록</h1>
	<form th:action="@{/members/add}" method="post" th:object="${member}">
	    이름: <input type="text" th:field="*{name}"><br>
	    이메일: <input type="text" th:field="*{email}"><br>
	    <button type="submit">등록</button>
	</form>
	<p><a th:href="@{/members}">목록으로</a></p>
</body>
</html>
