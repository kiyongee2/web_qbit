<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>할 일 목록 (완료 표시 기능)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    #todo-list {
      padding: 0;
      list-style-type: none;
    }
    #todo-list li {
      background: #f9f9f9;
      margin: 5px 0;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #ddd;
      cursor: pointer;
      transition: 0.2s;
    }
    #todo-list li:hover {
      background: #eee;
    }
    /* 완료된 항목 스타일 */
    .completed {
      text-decoration: line-through;
      color: gray;
      background: #e0e0e0;
    }
    #controls {
      margin: 10px 0;
    }
    input {
      padding: 5px;
      font-size: 14px;
    }
    button {
      padding: 6px 12px;
      margin-left: 5px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>할 일 목록</h1>

  <div id="controls">
    <input type="text" id="todoInput" placeholder="할 일을 입력하세요">
    <button id="addBtn">추가</button>
  </div>

  <ul id="todo-list">
    <li>자바스크립트 공부하기</li>
    <li>DOM 실습하기</li>
  </ul>

  <script>
    const todoInput = document.getElementById("todoInput");
    const addBtn = document.getElementById("addBtn");
    const todoList = document.getElementById("todo-list");

    // 공통 함수: 완료 표시 기능 추가
    function addCompleteEvent(li) {
      li.addEventListener("click", function() {
        li.classList.toggle("completed"); // 완료 상태 토글
      });
    }

    // 기존 항목에도 완료 기능 추가
    document.querySelectorAll("#todo-list li").forEach(li => {
      addCompleteEvent(li);
    });

    // 버튼 클릭 이벤트
    addBtn.addEventListener("click", function() {
      const todoText = todoInput.value.trim();

      if (todoText === "") {
        alert("할 일을 입력하세요!");
        return;
      }

      // 새로운 li 생성
      const newItem = document.createElement("li");
      newItem.textContent = todoText;

      // 완료 기능 추가
      addCompleteEvent(newItem);

      // 리스트에 추가
      todoList.appendChild(newItem);

      // 입력창 초기화
      todoInput.value = "";
      todoInput.focus();
    });

    // Enter 키로도 추가 가능
    todoInput.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        addBtn.click();
      }
    });
  </script>
</body>
</html>
