<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>버튼 이벤트</title>
  <link rel="stylesheet" href="css/bgColor.css">
</head>
<body>
  <!-- 버튼 메뉴 만들기 -->
  <div class="menu">
    <ul>
      <li>
        <a href="#" onclick="changeBg('green')">Green</a>
      </li>
      <li>
        <a href="#" onclick="changeBg('black')">Black</a>
      </li>
      <li>
        <a href="#" onclick="changeBg('pink')">Pink</a>
      </li>
    </ul>
  </div>
  <!-- 배경색을 넣을 사각형 -->
  <div id="rect" class="box"></div>

  <script>
    function changeBg(color){
      let rect = document.querySelector("#rect");
      rect.style.backgroundColor = color;
    }
  </script>
</body>
</html>
