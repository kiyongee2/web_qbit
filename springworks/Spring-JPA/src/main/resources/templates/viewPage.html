<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>JPA 데이터베이스</title>
</head>
<body>
	<h3>JPA 데이터베이스</h3>
	<p><a th:href="@{/members/new}">Member 데이터 삽입</a></p>
	
	<table border="1" cellpadding="10">
		<tr>
			<th>아이디</th>
			<th>이름</th>
			<th>이메일</th>
			<th>비고</th>
		</tr>
		<tr th:each="member : ${memberList}">
			<td th:text="${member.id}"></td>
			<td th:text="${member.name}"></td>
			<td th:text="${member.email}"></td>
		</tr>
	</table>
</body>
</html>
