<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ex06</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
	<button onclick="ex02Fn()">ex02 함수 호출</button>
</body>

<script>
	const ex02Fn = () => {
		const text = "Hello~";
		
		const params = {
			"param1": text,
			"param2": "안녕"
		}
		
		$.ajax({
			//요청 방식: get, 요청 주소: /ex02, 요청 데이터: data
			type: "post",
			url: "/ex02",
			data: params,
			//요청이 성공했을 때 실행되는 부분
			success: function(res){
				console.log("성공", res);
			},
			//요청이 실패했을 때 실행되는 부분
			error: function(){
				console.log("실패");
			}
		})
	}
</script>
</html>
