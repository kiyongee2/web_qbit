<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>button태그의 onclick 속성</title>
  <!-- 자바스크립트 태그 사용 -->
  <!-- <script>
    alert("안녕하세요!")
  </script> -->
</head>
<body>
  
  <!-- alert('msg') : 알림, 경고창, window.open(url) -->
  <p>
    <button type="button" onclick="alert('숫자를 입력해주세요')">전송</button>
  </p>
  <!-- confirm(): 확인/취소 창 -->
  <p>
    <button onclick="confirm('정말로 삭제하시겠습니까?')">삭제</button>
  </p>
  <p>
    <button onclick="window.open('https://www.gg.go.kr')">경기도청 가기</button>
  </p>

  <p>
    <button onclick="greet()">확인</button>
  </p>

  <script>
    /*function greet(){
      alert('안녕하세요!')
    }*/

    /*const greet = function(){
      alert('안녕하세요!');
    }*/
    
    //화살표 함수
    const greet = () => {
      alert('안녕하세요!')
    }

  </script>
</body>
</html>
