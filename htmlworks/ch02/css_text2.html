<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>text 스타일 예제</title>
        <style>
            h1{color: green}
            h2{
                font-family: "궁서";
                color: #0000ff;
            }
            p{
                /* 줄간격 2 - 간격이 글자 크기의 100% */
                line-height: 2;
            }
            a{
                font-size: 20px;
                text-decoration: none; /* 밑줄 없애기 */
                color: rgb(0, 0, 0);
            }
        </style>
    </head>
    <body>
        <h1>세계 10대 슈퍼푸드</h1>
        <h2>마늘(Garlic)</h2>
        <p>일해백리(一害百利)는 마늘의 별명이다. 한가지 해가 있고 백가지 이로움이
            있다는 뜻이다.<br> 그 한가지 해란 아린 맛으로 위에 부담을 준다는 것이다.
        </p>
        <p>마늘 특유의 아린 맛은 <span style="color: red">알리신</span>이라는 성분 때문으로 
            살균 및 항균작용을 하며<br> 마늘에 들어있는 아연이 피로 회복에 도움을 준다.
        </p>
        <hr>
        <h2>HTML5</h2>
        <p>다양한 기기로 접속할 수 있는 요즘.<br>
            <span style="text-decoration: line-through;">HTML4</span>HTML5를
            공부해야 할 때입니다.
        </p>
        <p>
            <a href="https://www.w3schools.com/" target="_blank">-> w3schools로 가기</a>
        </p>
    </body>
</html>
