<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>도서 목록</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
	  <div class="container">
	    <a class="navbar-brand fw-bold" th:href="@{/home}">BookMarket</a>
	    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"
	      aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
	      <span class="navbar-toggler-icon"></span>
	    </button>
	
	    <div class="collapse navbar-collapse justify-content-end" id="menu">
	      <ul class="navbar-nav">
	        <li class="nav-item"><a class="nav-link" th:href="@{/books/IT전문서}">IT전문서</a></li>
	        <li class="nav-item"><a class="nav-link" th:href="@{/books/IT교육교재} ">IT교육교재</a></li>
	      </ul>
	    </div>
	  </div>
	</nav>
	<section class="container bg-light py-4">
	  <div class="container">
	    <h1 class="display-5 fw-bold">도서 정보</h1>
	  </div>
	  <div class="row align-items-md-stretch py-5">
		<div class="col-md-12">
		  <h3 th:text="${book.name}"></h3>
		  <p th:text="${book.description}">
		  <br>
		  <p><b>도서코드 : </b><span class="badge text-bg-info"
		  			th:text="${book.bookId}"></span></p>
		  <p><b>저자 : </b><span th:text="${book.author}"></span></p>
		  <p><b>출판사 : </b> <span th:text="${book.publisher}"></span></p>
		  <p><b>출판일 : </b> <span th:text= "${book.releaseDate}"></span></p>
		  <p><b>분류 : </b> <span th:text= "${book.category}"></span></p>
		  <p><b>재고수 : </b> <span th:text= "${book.unitsInStock}"></span></p>
		  <!--  <h4 th:text="${book.unitPrice} + '원'"></h4>-->
		  <br>
		  <p><a th:href="@{/books/all}" class="btn btn-secondary">도서 목록</a></p>
	  	</div>
	  </div>
	</section>
	
	<footer class="pt-3 mt-4 text-body-secondary border-top">
		<div class="container pt-5">
			<p class="fs-5">&copy; BookMarket</p>
		</div>
	</footer>
</body>
</html>
