<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Welcome~</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<section id="container">
		<h2>게시판</h2>
		<!--  
	    <div style="text-align: center;">
			<th:block th:if="${session.loginMember}">
				<span th:text="${session.loginName} + '님 환영합니다.'"></span>
			</th:block>
			<a th:href="@{/members/logout}">
				<button>로그아웃</button>
			</a>
		</div>
		-->
		<table class="boardList">
			<thead>
				<tr>
					<th>번호</th>
					<th>제목</th>
					<th>글쓴이</th>
					<th>조회수</th>
					<th>작성일</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="b: ${boardList}">
					<td th:text="${b.id}"></td>
					<td>
						<a th:href="@{/boards/{id}(id=${b.id})}" th:text="${b.title}"></a>
					</td>
					<td th:text="${b.writer}"></td>
					<td th:text="${b.hits}"></td>
					<td th:text="${b.regDate}"></td>
				</tr>
			</tbody>
		</table>
		<div class="btnWrite">
			<a th:href="@{/boards/write}">
				<button>글쓰기</button>
			</a>
		</div>
	</section>
</body>
</html>
