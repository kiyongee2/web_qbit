<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 폼 만들기</title>
    <style>
        h2{
            margin: 20px;
            color: #369;
        }
        form{
            width: 350px;
            border: 1px solid #ccc;
            padding: 10px;
            margin: 20px;
        }
        form ul{
            padding: 0;
            margin: 0;
        }
        ul li{
            list-style: none;
            margin: 20px;
        }
        label{
            display: inline-block;
            width: 80px;
            text-align: right;
            margin-right: 10px;
        }
        button{
            margin-left: 100px;
            padding: 5px 15px;
            background: #ccc;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>로그인</h2>
    <form action="login.jsp" method="post">
        <ul>
            <li>
                <label for="userid">아이디</label>
                <input type="text" name="userid" id="userid">
            </li>
            <li>
                <label for="userpw">비밀번호</label>
                <input type="password" name="userpw" id="userpw">
            </li>
            <li>
                <button type="submit">로그인</button>
            </li>
        </ul>
    </form>
</body>
</html>
