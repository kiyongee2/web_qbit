<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h2>중첩 for문</h2>
  <div id="demo"></div>

  <script>
    const demo = document.getElementById("demo");

    for(var i=0; i<5; i++){
      for(var j=1; j<=5; j++){
        let num = i*5 + j;
        demo.innerHTML += num + " ";
      }
      demo.innerHTML += "<br>";
    }
    demo.innerHTML += "<br>";

    for(var i=0; i<5; i++){
      for(var j=1; j<=5; j++){
        let num = i*5 + j;
        if(num > 23) break;
        demo.innerHTML += num + " ";
      }
      demo.innerHTML += "<br>";
    }
    demo.innerHTML += "<br>";

  </script>
</body>
</html>
