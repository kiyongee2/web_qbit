<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Validation..</title>
	<style type="text/css">
		span{color: red;}
	</style>
</head>
<body>
	<h3>유효성 검사</h3>
	<form th:action="@{/valid}" method="post"
			th:object="${product}">
		<p>
			품명 <input type="text" th:field="*{name}"> <span th:errors="*{name}"></span>
		</p>
		<p>
			가격 <input type="text" th:field="*{price}"> <span th:errors="*{price}"></span>
		</p>
		<p><input type="submit" value="확인">
		   <input type="submit" value="취소"></p>
	</form>
</body>
</html>
