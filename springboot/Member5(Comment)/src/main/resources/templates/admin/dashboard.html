<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Admin Dashboard</title>
    <link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css}" 
          rel="stylesheet">
</head>
<body class="bg-light">

    <div th:replace="~{/layout/header::header-fragment}"></div>

    <section class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="display-5 fw-bold text-primary">관리자 대시보드</h1>
            <div>
                <span sec:authentication="principal.name"></span> 님 |
                <a th:href="@{/logout}" class="text-danger text-decoration-none">로그아웃</a>
            </div>
        </div>

        <!-- 관리자 통계 영역 -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-center shadow-sm border-primary">
                    <div class="card-body">
                        <h5 class="card-title">총 회원 수</h5>
                        <p class="fs-4 fw-bold text-primary" th:text="${totalMembers}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow-sm border-success">
                    <div class="card-body">
                        <h5 class="card-title">총 게시글 수</h5>
                        <p class="fs-4 fw-bold text-success" th:text="${totalBoards}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-center shadow-sm border-warning">
                    <div class="card-body">
                        <h5 class="card-title">오늘 방문자 수</h5>
                        <p class="fs-4 fw-bold text-warning" th:text="${todayVisitors}">0</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 관리자 도구 -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-3">관리자 도구</h3>
                <p><a th:href="@{/members}" class="text-decoration-none text-danger fw-bold">회원 관리</a></p>
                <p><a th:href="@{/boards/pages}" class="text-decoration-none text-success fw-bold">게시판 관리</a></p>
            </div>
        </div>
    </section>

    <div th:replace="~{/layout/footer::footer-fragment}"></div>

</body>
</html>
