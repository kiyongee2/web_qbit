<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>게시글 수정</title>
<link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css}" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
	<div th:replace="~{/layout/header::header-fragment}"></div>
	<section class="container bg-light py-4">
	  <div class="container">
	    <h1 class="display-5 fw-bold">글 수정</h1>
	  </div>
		<form th:action="@{/boards/update}" method="post" class="py-4">
			<input type="hidden" name="id" th:value="${board.id}">
			<div class="mb-3 row">
	  			<div class="col-sm-3">
					<input type="text" name="title" size=62
						th:value="${board.title}" class="form-control">
				</div>
			</div>
			<div class="mb-3 row">
	  			<div class="col-sm-3">
					<textarea rows="8" cols="60" name="content"
						 th:text="${board.content}" class="form-control"></textarea>
				</div>
			</div>
			<div class="mb-3 row">
	  			<div class="col-sm-3">
					<input type="text" name="writer" size=62 readonly
							th:value="'글쓴이: ' + ${board.writer} + '(작성일: ' 
							+ ${board.regDate} + ')' " class="form-control">
				</div>
			</div>
			<div class="mb-3 row">
	  			<div class="col-sm-3">
					<input type="text" name="writer" size=62 readonly
						th:value="'조회수: ' + ${board.hits}" class="form-control">
				</div>
			</div>
			<div class="mb-3 row">
	  			<div class="col-sm-3">
					<button type="submit" class="btn btn-primary">저장</button>
					<button type="reset" class="btn btn-secondary">취소</button>
				</div>
			</div>
		</form>
	</section>
</body>
</html>
