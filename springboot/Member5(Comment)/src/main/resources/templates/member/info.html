<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
	<meta charset="UTF-8">
	<title>회원 정보</title>
	<link th:href="@{https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css}" 
          rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <div th:replace="~{/layout/header::header-fragment}"></div>
    
    <!-- 회원 정보 섹션 -->
	<section class="container py-5">
	  <div class="card shadow-sm">
	    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
	      <h4 class="mb-0">회원 정보</h4>
	      <i class="bi bi-person-circle fs-3"></i>
	    </div>

	    <div class="card-body bg-white">
	      <form>
	        <div class="mb-3 row">
	          <label class="col-sm-2 col-form-label fw-bold">이메일</label>
	          <div class="col-sm-6">
	            <input type="text" class="form-control" th:value="${member.email}" readonly>
	          </div>
	        </div>

	        <div class="mb-3 row">
	          <label class="col-sm-2 col-form-label fw-bold">비밀번호</label>
	          <div class="col-sm-6">
	            <input type="password" class="form-control" th:value="${member.passwd}" readonly>
	          </div>
	        </div>

	        <div class="mb-3 row">
	          <label class="col-sm-2 col-form-label fw-bold">이름</label>
	          <div class="col-sm-6">
	            <input type="text" class="form-control" th:value="${member.name}" readonly>
	          </div>
	        </div>

	        <div class="mb-4 row">
	          <label class="col-sm-2 col-form-label fw-bold">성별</label>
	          <div class="col-sm-6 d-flex align-items-center">
	            <div class="form-check me-3">
	              <input class="form-check-input" type="radio" name="gender" value="남자" th:checked="${member.gender=='남자'}" disabled>
	              <label class="form-check-label">남</label>
	            </div>
	            <div class="form-check">
	              <input class="form-check-input" type="radio" name="gender" value="여자" th:checked="${member.gender=='여자'}" disabled>
	              <label class="form-check-label">여</label>
	            </div>
	          </div>
	        </div>

	        <!-- 버튼 영역 -->
	        <div class="text-end">
	          <th:block sec:authorize="isAuthenticated()">
	            <th:block th:if="${#authentication.principal.name == member.name}">
	              <a th:href="@{/members/edit/{id}(id=${member.id})}" class="btn btn-outline-primary me-2">
	                <i class="bi bi-pencil"></i> 수정
	              </a>
	              <a th:href="@{/members/delete/{id}(id=${member.id})}"
	                 onclick="return confirm('정말 탈퇴하시겠습니까?')" 
	                 class="btn btn-outline-danger me-2">
	                <i class="bi bi-person-x"></i> 탈퇴
	              </a>
	            </th:block>
	          </th:block>
	          <a th:href="@{/members}" class="btn btn-secondary">
	            <i class="bi bi-list"></i> 목록
	          </a>
	        </div>
	      </form>
	    </div>
	  </div>
	</section>
