<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
<meta charset="UTF-8">
<title>스프링 시큐리티</title>
</head>
<body>
	<h3>스프링 시큐리티</h3>
	<div sec:authorize="hasRole('USER')" >
		<p><b>회원 권한 화면입니다.</b></p>
	</div>
	<div sec:authorize="isAuthenticated()">
		<p>ROLE_USER 권한 로그인 중입니다.</p>
		<p><a href="/auth2">[웹 요청 URL /auth2로 이동하기]</a>
	</div>
	<div sec:authorize="isAnonymous()">
		<p>로그인 중이 아닙니다.</p>
		<p><a href="/member/tag">[웹 요청 URL /member/tag로 이동하기]</a>
	</div>
</body>
</html>
