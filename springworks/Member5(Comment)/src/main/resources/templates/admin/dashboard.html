<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
<meta charset="UTF-8">
<title th:text="${pageTitle}">Admin Dashboard</title>
<link rel="stylesheet" th:href="@{/css/style.css}">
<style>
    body {
        font-family: "맑은 고딕", sans-serif;
        background-color: #f7f9fc;
        margin: 0;
        padding: 0;
    }
    header {
        background-color: #2c3e50;
        color: white;
        padding: 15px;
        text-align: center;
    }
    .dashboard-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin: 30px;
    }
    .card {
        background-color: white;
        border-radius: 15px;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        padding: 20px;
        text-align: center;
    }
    .card h3 {
        color: #34495e;
        margin-bottom: 10px;
    }
    .card p {
        font-size: 22px;
        font-weight: bold;
        color: #3498db;
    }
    footer {
        margin-top: 40px;
        text-align: center;
        color: gray;
    }
</style>
</head>
<body>
    <header>
        <h1>관리자 대시보드</h1>
        <div>
            <span sec:authentication="principal.name"></span> 님 |
            <a th:href="@{/perform_logout}" onclick="event.preventDefault(); document.getElementById('logout-form').submit();">로그아웃</a>
            <form id="logout-form" th:action="@{/perform_logout}" method="post" style="display:none;"></form>
        </div>
    </header>

    <section class="dashboard-container">
    <!--  
        <div class="card">
            <h3>총 회원 수</h3>
            <p th:text="${totalMembers}">0</p>
        </div>
        <div class="card">
            <h3>총 게시글 수</h3>
            <p th:text="${totalBoards}">0</p>
        </div>
        <div class="card">
            <h3>오늘 방문자 수</h3>
            <p th:text="${todayVisitors}">0</p>
        </div>
        
        -->
        <div class="card">
            <h3>관리자 도구</h3>
            <p><a th:href="@{/members}" style="color:#e67e22; text-decoration:none;">회원 관리</a></p>
            <p><a th:href="@{/boards/pages}" style="color:#27ae60; text-decoration:none;">게시판 관리</a></p>
        </div>
    </section>

    <footer>
        © 2025 Good Relation Admin
    </footer>
</body>
</html>
